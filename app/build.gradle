plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rlyles.wep'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rlyles.wep'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be sideloaded straight away.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.graphicsMode', 'NATIVE'
                systemProperty 'screenshotDir', System.getProperty('screenshotDir', '')
                systemProperty 'cardsDll', System.getProperty('cardsDll', '')
                systemProperty 'mediaDir', System.getProperty('mediaDir', '')
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
